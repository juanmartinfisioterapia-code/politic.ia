<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politic.IA · Cómo lo cuenta cada medio</title>
<meta name="description" content="La misma noticia política contada por cada periódico, una al lado de la otra. Mismas noticias, distinto prisma.">
<meta property="og:title" content="Politic.IA · Mismas noticias, distinto prisma">
<meta property="og:description" content="La misma noticia política contada por cada periódico, una al lado de la otra.">
<link rel="stylesheet" href="fonts/fuentes.css">
<style>
  :root { --bg:#f7f6f2; --card:#fff; --txt:#1d1d1b; --sec:#5f5e5a; --muted:#8a8984; --borde:#e2e0d8; --acento:#185fa5; --acento-bg:#e6f1fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151513; --card:#1f1f1c; --txt:#ecebe6; --sec:#b4b2a9; --muted:#888780; --borde:#33322e; --acento:#85b7eb; --acento-bg:#0c2a47; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.55 var(--texto); }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; padding-bottom:12px; position:relative; }
  header::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px; border-radius:3px; background:var(--prisma); }
  .logo { font-family:var(--titulos); font-size:28px; font-weight:700; letter-spacing:-0.5px; text-decoration:none; color:var(--txt); }
  .logo span { background:var(--prisma); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lema { color:var(--sec); font-size:14px; margin-left:8px; }
  .fecha { color:var(--muted); font-size:12px; letter-spacing:1px; text-transform:uppercase; }
  .buscar { margin:16px 0; }
  .buscar input { width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--borde); border-radius:10px; background:var(--card); color:var(--txt); }
  .grupo { background:var(--card); border:1px solid var(--borde); border-radius:16px; padding:16px; margin-bottom:16px; }
  .meta { font-size:12px; color:var(--muted); margin:0 0 4px; letter-spacing:.5px; text-transform:uppercase; }
  .grupo h2 { font-family:var(--titulos); font-size:18px; font-weight:500; margin:0 0 12px; line-height:1.35; letter-spacing:-0.2px; }
  .grupo.principal h2 { font-size:22px; }
  .rejilla { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
  .item { display:block; border:1px solid var(--borde); border-radius:10px; padding:10px 12px; text-decoration:none; color:var(--txt); }
  .item:hover { border-color:var(--acento); }
  .item.hueco { border-style:dashed; color:var(--muted); }
  .item.hueco .tit { font-style:italic; }
  .item .medio { font-size:11px; color:var(--sec); display:flex; justify-content:space-between; letter-spacing:.6px; text-transform:uppercase; }
  .item .tit { font-size:15px; margin-top:4px; }
  .acciones { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button, .boton { font:inherit; font-size:14px; padding:7px 12px; border-radius:8px; border:1px solid var(--borde); background:transparent; color:var(--txt); cursor:pointer; text-decoration:none; }
  button:hover, .boton:hover { border-color:var(--acento); }
  .tendencias { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px; }
  .chip { display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; background:var(--acento-bg); color:var(--acento); border:none; margin-bottom:6px; }
  .vacio { text-align:center; color:var(--sec); padding:40px 0; }
  footer { border-top:1px solid var(--borde); margin-top:24px; padding-top:12px; font-size:13px; color:var(--muted); }
  footer a { color:var(--sec); }
  .aviso { background:var(--acento-bg); color:var(--acento); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:16px; }

  /* Detalles de acabado */
  .cabecera { position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); margin:0 -16px; padding:12px 16px 0; }
  .pulso { display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--sec); letter-spacing:.5px; text-transform:uppercase; margin:14px 0 0; }
  .pulso i { width:8px; height:8px; border-radius:50%; background:#3DDC97; box-shadow:0 0 0 0 rgba(61,220,151,.6); animation:late 2s infinite; }
  @keyframes late { 0% { box-shadow:0 0 0 0 rgba(61,220,151,.55); } 70% { box-shadow:0 0 0 9px rgba(61,220,151,0); } 100% { box-shadow:0 0 0 0 rgba(61,220,151,0); } }
  .grupo { transition:transform .2s ease, box-shadow .2s ease; animation:entra .5s ease both; }
  .grupo:hover { transform:translateY(-2px); box-shadow:0 10px 30px -18px rgba(0,0,0,.35); }
  @keyframes entra { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .grupo.principal { border:2px solid transparent; background:linear-gradient(var(--card),var(--card)) padding-box, var(--prisma) border-box; }
  .num { font-family:var(--titulos); font-weight:700; font-size:13px; background:var(--prisma); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .item { transition:border-color .15s ease, transform .15s ease; }
  .item:hover { transform:translateY(-1px); }
  .insignia { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 5px; border-radius:6px; font-family:var(--titulos); font-size:9px; font-weight:700; color:#fff; margin-right:6px; letter-spacing:0; }
  .medio > span:first-child { display:inline-flex; align-items:center; }
  .buscar input { transition:border-color .15s ease, box-shadow .15s ease; }
  .buscar input:focus { outline:none; border-color:transparent; box-shadow:0 0 0 2px #fff, 0 0 0 4px #4DA3FF; }
  @media (prefers-reduced-motion: reduce) { .grupo, .item, .pulso i { animation:none; transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="cabecera"><header>
    <div><a class="logo" href="./">Politic<span>.IA</span></a><span class="lema">Mismas noticias, distinto prisma</span></div>
    <span class="fecha" id="fecha"></span>
  </header></div>
  <p class="pulso" id="pulso"><i></i><span>Conectando con las redacciones…</span></p>

  <div class="buscar"><input id="q" type="search" placeholder="Busca un político, un partido o un tema" aria-label="Buscar"></div>

  <div id="tendencias" class="tendencias"></div>

  <div class="aviso">La misma noticia, contada por cada periódico. Cada uno la pinta de un color: aquí los ves todos juntos y decides tú. Pulsa un titular para leerlo en su web.</div>

  <main id="lista"><p class="vacio">Cargando noticias…</p></main>

  <footer>
    <p id="estado"></p>
    <p><a href="criterios.html">Qué medios salen y por qué</a> · <a href="aviso-legal.html">Aviso legal</a></p>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlSegura = u => /^https?:\/\//i.test(u) ? u : '#';
const sinAcentos = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const hora = iso => new Date(iso).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
const hace = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `hace ${m} min` : `hace ${Math.round(m/60)} h`; };

$('#fecha').textContent = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

let grupos = [];
const COLORES = ['#E2445C','#F28C28','#2BB673','#1E88E5','#8E44AD','#00A3A3','#D81B60','#5D6D7E'];
const colorDe = id => COLORES[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORES.length];
const siglas = n => (n || '').replace(/^(El|La|Los|Las)\s+/i, '').split(/[\s.]+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const insignia = id => `<b class="insignia" style="background:${color[id] || colorDe(id)}">${esc(sigla[id] || siglas(nombre[id] || id))}</b>`;
const GRANDES = ['elpais', 'elmundo', 'abc', 'lavanguardia']; // siempre primero, en este orden

const coincide = (texto, f) => { const t = sinAcentos(texto); return f.split(/\s+/).filter(Boolean).every(p => t.includes(p)); };
const DOMINIOS = ['elpais.com','elmundo.es','abc.es','lavanguardia.com','eldiario.es','elconfidencial.com','elespanol.com','larazon.es','publico.es','okdiario.com','libertaddigital.com','eldebate.com','europapress.es','rtve.es'];
const enlaceGoogle = q => 'https://news.google.com/search?hl=es&gl=ES&ceid=ES:es&q=' + encodeURIComponent(q + ' (' + DOMINIOS.map(d => 'site:' + d).join(' OR ') + ')');
let archivo = null;
async function buscarArchivo(filtro) {
  if (!archivo) { try { archivo = await fetch('data/archivo.json?t=' + Date.now()).then(r => r.json()); } catch { archivo = []; } }
  const f = sinAcentos(filtro.trim());
  if (sinAcentos($('#q').value.trim()) !== f) return; // el usuario ya ha escrito otra cosa
  const res = archivo.filter(a => coincide(a.t, f)).slice(0, 80);
  const google = `<p class="vacio"><a class="boton" href="${enlaceGoogle(filtro.trim())}" target="_blank" rel="noopener">Buscar "${esc(filtro.trim())}" en los periódicos con Google Noticias</a></p>`;
  if (!res.length) { $('#lista').innerHTML = `<p class="vacio">No hay titulares sobre "${esc(filtro.trim())}" en los últimos 30 días.</p>` + google; return; }
  $('#lista').innerHTML = `<article class="grupo"><p class="meta">${res.length} titulares de los últimos 30 días</p><div class="rejilla">` +
    res.map(a => `<a class="item" href="${esc(urlSegura(a.u))}" target="_blank" rel="noopener">
      <div class="medio"><span>${insignia(a.m)}${esc(nombre[a.m] || a.m)}</span><span>${new Date(a.f).toLocaleDateString('es-ES', { day:'numeric', month:'short' })}</span></div>
      <div class="tit">${esc(a.t)}</div></a>`).join('') + `</div></article>` + google;
}

function pintar(filtro = '') {
  const f = sinAcentos(filtro.trim());
  const visibles = grupos.filter(g => !f || g.items.some(i => coincide(i.titulo, f)));
  if (!visibles.length && f) { $('#lista').innerHTML = '<p class="vacio">Buscando en el archivo…</p>'; buscarArchivo(filtro); return; }
  if (!visibles.length) { $('#lista').innerHTML = '<p class="vacio">Todavía no hay noticias. El robot las recoge cada hora.</p>'; return; }
  $('#lista').innerHTML = visibles.slice(0, 60).map((g, k) => {
    const base = g.items.find(i => i.medio === 'europapress') || g.items[0];
    const orden = i => { const k = GRANDES.indexOf(i.medio); return k < 0 ? 99 : k; };
    const lista = [...g.items].sort((a, b) => orden(a) - orden(b));
    const huecos = g.n >= 3 ? GRANDES.filter(id => !g.items.some(i => i.medio === id)) : [];
    const vacios = huecos.map(id => `
      <div class="item hueco">
        <div class="medio"><span>${insignia(id)}${esc(nombre[id] || id)}</span></div>
        <div class="tit">No hemos encontrado su titular sobre esto</div>
      </div>`).join('');
    const items = lista.map(i => `
      <a class="item" href="${esc(urlSegura(i.url))}" target="_blank" rel="noopener">
        <div class="medio"><span>${insignia(i.medio)}${esc(nombre[i.medio] || i.medio)}</span><span>${hora(i.fecha)}</span></div>
        <div class="tit">${esc(i.titulo)}</div>
      </a>`).join('') + vacios;
    return `<article class="grupo ${k === 0 && !f ? 'principal' : ''}">
      ${g.tendencia ? `<span class="chip">Tendencia: ${esc(g.tendencia)}</span>` : ''}
      <p class="meta">${g.n > 1 ? `<span class="num">${g.n}</span> medios lo cuentan` : 'Solo lo cuenta un medio'}</p>
      <h2>${esc(base.titulo)}</h2>
      <div class="rejilla">${items}</div>
      <div class="acciones"><button data-k="${k}">Compartir por WhatsApp</button></div>
    </article>`;
  }).join('');
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const g = visibles[b.dataset.k];
    const lineas = g.items.slice(0, 5).map(i => `${nombre[i.medio] || i.medio}: "${i.titulo}"`).join('\n');
    const texto = `Así cuentan los medios la misma noticia:\n\n${lineas}\n\nCompáralos en Politic.IA: ${location.href.split('#')[0]}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  });
}

let nombre = {}, sigla = {}, color = {};
Promise.all([
  fetch('data/noticias.json?t=' + Date.now()).then(r => r.json()),
  fetch('medios.json').then(r => r.json())
]).then(([datos, medios]) => {
  medios.forEach(m => { nombre[m.id] = m.nombre; sigla[m.id] = m.sigla; color[m.id] = m.color; });
  grupos = datos.grupos || [];
  const tend = datos.tendencias || [];
  if (tend.length) {
    $('#tendencias').innerHTML = '<span class="meta">Lo más buscado ahora:</span> ' +
      tend.slice(0, 10).map(t => `<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('');
    document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { $('#q').value = b.dataset.t; pintar(b.dataset.t); });
  }
  pintar();
  const ok = (datos.estado || []).filter(e => e.ok && e.medio !== 'Google Trends').length;
  if (datos.actualizado) $('#pulso span').textContent = `En marcha · actualizado ${hace(datos.actualizado)} · ${ok} medios leídos`;
  $('#estado').textContent = datos.actualizado
    ? `Actualizado ${hace(datos.actualizado)} · ${ok} de ${medios.length} medios leídos correctamente`
    : 'Esperando la primera actualización del robot.';
}).catch(() => { $('#lista').innerHTML = '<p class="vacio">No se han podido cargar las noticias. Prueba en un rato.</p>'; });

let espera;
$('#q').addEventListener('input', e => { clearTimeout(espera); espera = setTimeout(() => pintar(e.target.value), 300); });
</script>
</body>
</html>
